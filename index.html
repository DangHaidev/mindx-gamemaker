<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Name Card của tôi</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="card">
      <img
        class="avatar"
        src="https://placehold.co/150x150?text=Hello+World"
        alt="Ảnh đại diện"
      />

      <h1>Nguyễn Thị Phương</h1>

      <h2>Học viên Web Basic</h2>

      <p class="introduction">
        Xin chào! Mình yêu thích công nghệ, vẽ tranh và khám phá những điều mới.
      </p>

      <h3>Sở thích của mình</h3>

      <ul>
        <li>Lập trình</li>
        <li>Đọc truyện</li>
        <li>Chơi thể thao</li>
      </ul>

      <button id="hello-button">Gửi lời chào</button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
